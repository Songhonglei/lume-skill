services:
  server:
    image: ${LUMA_SKILL_HUB_SERVER_IMAGE:-localhost/lumaskill-hub-server:v0.2.28}
    build:
      context: ./server
      dockerfile: Dockerfile
  web:
    image: ${LUMA_SKILL_HUB_WEB_IMAGE:-localhost/lumaskill-hub-web:v0.2.28}
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      SKILLHUB_WEB_ANALYTICS_CONFIG: ${LUMA_SKILL_HUB_ANALYTICS_CONFIG:-}
      SKILLHUB_WEB_ANALYTICS_UPSTREAM: ${LUMA_SKILL_HUB_ANALYTICS_UPSTREAM:-}
