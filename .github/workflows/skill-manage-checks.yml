name: Skill Manage checks

on:
  push:
    branches: [main]
    paths: ['skill-manage/**', '.github/workflows/skill-manage-checks.yml']
  pull_request:
    paths: ['skill-manage/**', '.github/workflows/skill-manage-checks.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-manage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: skill-manage

env:
  SOURCE_DATE_EPOCH: '1700000000'
  UV_NO_PROGRESS: '1'

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.11', '3.12', '3.13']
        include:
          - os: macos-14
            python: '3.12'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: python3 -m pip install uv==0.12.3
      - run: uv sync --locked --extra dev
      - run: uv run --locked ruff check src tests
      - run: uv run --locked ruff format --check src tests
      - run: node --check src/skill_mng/static/app.js
      - run: git diff --check
      - run: uv run --locked python3 -m pytest -q
      - name: Real static Web and worker corpus (no model)
        run: uv run --locked python3 -m skill_mng.regression --mode static --output .local/static-regression.json
      - run: uv build --out-dir dist
      - name: Check runtime lock and all distribution bytes
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --no-header --format requirements-txt --output-file .local/runtime-requirements.txt
          uv run --locked python3 -m skill_mng.distribution --dist-dir dist --runtime-requirements .local/runtime-requirements.txt --output .local/distribution-manifest.json
      - name: Install the wheel into a clean environment
        run: |
          uv venv --python "$(command -v python3)" .local/wheel-env
          uv pip install --python .local/wheel-env/bin/python --no-deps -r .local/runtime-requirements.txt
          uv pip install --python .local/wheel-env/bin/python --no-deps dist/*.whl
      - name: Installed CLI and worker smoke
        run: uv run --locked python3 tests/smoke_wheel.py .local/wheel-env/bin/skill-mng > .local/wheel-smoke.json
      - name: Save only selected evidence and candidate artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: skill-manage-${{ matrix.os }}-python-${{ matrix.python }}
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            skill-manage/.local/static-regression.json
            skill-manage/.local/distribution-manifest.json
            skill-manage/.local/wheel-smoke.json
            skill-manage/dist/*.whl
            skill-manage/dist/*.tar.gz
