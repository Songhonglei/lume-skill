[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "open-skill-mng"
version = "0.3.2.dev5"
description = "Self-hosted Skill registry with immutable versions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi==0.161.1",
  "starlette==1.9.0",
  "uvicorn==0.54.0",
  "python-multipart==0.0.32",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "httpx==0.28.1", "ruff==0.14.1", "build==1.2.2.post1"]

[project.scripts]
skill-mng = "skill_mng.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/skill_mng"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
